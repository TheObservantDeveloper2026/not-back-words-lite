name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许 Pages 工作流写入部署权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一分支只保留最新一次部署，避免并发覆盖
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Electron / Capacitor 体积大且构建网页版用不到，跳过可选依赖加速安装
      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Unit tests
        run: npm test

      - name: Build with Pages base path
        run: npm run build:pages

      - name: Disable Jekyll processing and 404 fallback
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4